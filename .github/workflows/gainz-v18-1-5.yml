name: Gainz v18.1.5 thumbnail patch

on:
  push:
    paths:
      - '.github/workflows/gainz-v18-1-5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gainz v18.1.5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              ('<div id="boot">Gainz v18.1.4を準備中…</div>', '<div id="boot">Gainz v18.1.5を準備中…</div>'),
              ('<iframe id="gainzFrame" src="./legacy.html?v=18.1.4" title="Gainz"></iframe>', '<iframe id="gainzFrame" src="./legacy.html?v=18.1.5" title="Gainz"></iframe>'),
              ('versionBadge.textContent="v18.1.4";', 'versionBadge.textContent="v18.1.5";'),
              ('.quick-fact strong{display:block;overflow:hidden;margin-top:4px;color:var(--text);font-size:13px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}', '.quick-fact strong{display:block;overflow:hidden;margin-top:4px;color:var(--text);font-size:13px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}\n.quick-video-thumb{width:min(100%,240px);aspect-ratio:16/9;margin-top:10px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#050506}\n.quick-video-thumb[hidden]{display:none}\n.quick-video-thumb img{display:block;width:100%;height:100%;object-fit:cover}'),
              ('  overview.innerHTML=\'<div class="quick-fact"><span class="quick-fact-label">今の動画</span><strong id="quickVideoTitle">—</strong></div><div class="quick-fact"><span class="quick-fact-label">次の種目</span><strong id="quickNextTitle">—</strong></div>\';', '  overview.innerHTML=\'<div class="quick-fact"><span class="quick-fact-label">今の動画</span><strong id="quickVideoTitle">—</strong><div class="quick-video-thumb" id="quickVideoThumb" hidden><img id="quickVideoThumbImg" alt=""></div></div><div class="quick-fact"><span class="quick-fact-label">次の種目</span><strong id="quickNextTitle">—</strong></div>\';'),
              ('    q("#quickVideoTitle").textContent=empty?"部位を選ぶと表示":v?v.title:"動画候補なし";\n    q("#sessionVideoTitle").textContent=empty?"部位未選択":v?v.title:"動画候補なし";', '    q("#quickVideoTitle").textContent=empty?"部位を選ぶと表示":v?v.title:"動画候補なし";\n    const thumb=q("#quickVideoThumb"),thumbImg=q("#quickVideoThumbImg");\n    if(!empty&&v){\n      thumb.hidden=false;\n      if(thumbImg.dataset.videoId!==v.id){\n        thumbImg.src=`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;\n        thumbImg.dataset.videoId=v.id;\n      }\n      thumbImg.alt=`${v.title} サムネイル`;\n    }else{\n      thumb.hidden=true;thumbImg.removeAttribute("src");delete thumbImg.dataset.videoId;thumbImg.alt="";\n    }\n    q("#sessionVideoTitle").textContent=empty?"部位未選択":v?v.title:"動画候補なし";'),
              ('  const ver=q(".ver");if(ver)ver.textContent="Gainz v18.1.4 · 2026.09.02";', '  const ver=q(".ver");if(ver)ver.textContent="Gainz v18.1.5 · 2026.09.02";')
          ]

          for i, (old, new) in enumerate(replacements, 1):
              if old not in s:
                  raise SystemExit(f'patch target {i} not found')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Gainz v18.1.5: show workout thumbnail before start'
          git push