name: Gainz v18.1.4 patch

on:
  push:
    paths:
      - '.github/workflows/gainz-v18-1-4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gainz v18.1.4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              ('<div id="boot">Gainz v18.1.3を準備中…</div>', '<div id="boot">Gainz v18.1.4を準備中…</div>'),
              ('<iframe id="gainzFrame" src="./legacy.html?v=18.1.3" title="Gainz"></iframe>', '<iframe id="gainzFrame" src="./legacy.html?v=18.1.4" title="Gainz"></iframe>'),
              ('.lower-zone-title{margin-top:32px!important;color:var(--dim)!important}', '.lower-zone-title{margin-top:32px!important;color:var(--dim)!important}\n.brand,#today{display:none!important}\n.gainz-version-top{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:30;border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:rgba(20,20,25,.92);color:var(--accent2);font-size:10.5px;font-weight:900;letter-spacing:.04em;backdrop-filter:blur(8px)}'),
              ('  const compact=u=>String(u||"").trim();', '  const compact=u=>String(u||"").trim();\n  const versionBadge=document.createElement("div");\n  versionBadge.className="gainz-version-top";\n  versionBadge.textContent="v18.1.4";\n  q(".wrap").appendChild(versionBadge);'),
              ('    abs:{icon:"🔥",label:"腹筋",sub:"下腹・腹全体",names:["腹筋ローラー","レッグレイズ","サポート・ニーレイズ","ロシアンツイスト"],videos:[\n      {n:"腹筋 2分｜アブローラー｜1:40〜4:00",u:"https://youtu.be/R4vb8poJnv0?start=100&end=240"},\n      {n:"レッグレイズ｜下腹を一緒にやる",u:"https://youtu.be/C9xfentB4QA"},\n      {n:"腹筋 6分｜シックスパック",u:"https://youtu.be/yfF-Q2NhVnE",want:1},\n      {n:"腹筋ローラー｜初心者向け",u:"https://youtu.be/fLbAZW0pZfo"},\n      {n:"ハンギングニーレイズ",u:"https://youtu.be/7bVKRM8GkdI"}\n    ]},', '    abs:{icon:"🔥",label:"腹筋",sub:"下腹・腹全体",names:["腹筋ローラー","レッグレイズ","サポート・ニーレイズ","ロシアンツイスト"],videos:[\n      {n:"腹筋ローラー｜初心者向け3分",u:"https://youtu.be/fLbAZW0pZfo"},\n      {n:"腹筋 2分｜アブローラー｜1:40〜4:00",u:"https://youtu.be/R4vb8poJnv0?start=100&end=240"},\n      {n:"レッグレイズ｜下腹を一緒にやる",u:"https://youtu.be/C9xfentB4QA"},\n      {n:"腹筋 6分｜シックスパック",u:"https://youtu.be/yfF-Q2NhVnE",want:1},\n      {n:"ハンギングニーレイズ",u:"https://youtu.be/7bVKRM8GkdI"}\n    ]},'),
              ('      {n:"背中 自重3分／懸垂伴走",u:"https://youtu.be/hj2j-RsUiSE"},', '      {n:"背中 自重3分／懸垂伴走｜0:30〜4:03",u:"https://youtu.be/hj2j-RsUiSE?start=30&end=243"},'),
              ('  function makePlan(){\n    const ex=[];const videos=[];\n    selected.forEach(k=>{\n      groups[k].names.forEach(n=>{const x=catalog.get(n);if(x)ex.push(clone(x));});\n      groups[k].videos.forEach(v=>videos.push(clone(v)));\n    });\n    return {goal:Math.min(4,ex.length),ex:uniqueByName(ex),opt:[],vid:uniqueByName(videos)};\n  }', '  function makePlan(){\n    const ex=[];const videos=[];\n    if(selected.includes("abs")){\n      const roller=catalog.get("腹筋ローラー");\n      if(roller)ex.push(clone(roller));\n    }\n    selected.forEach(k=>{\n      groups[k].names.forEach(n=>{\n        if(n==="腹筋ローラー")return;\n        const x=catalog.get(n);if(x)ex.push(clone(x));\n      });\n    });\n    if(selected.includes("back")&&groups.back.videos[0])videos.push(clone(groups.back.videos[0]));\n    if(selected.includes("abs")&&groups.abs.videos[0])videos.push(clone(groups.abs.videos[0]));\n    selected.forEach(k=>groups[k].videos.forEach(v=>videos.push(clone(v))));\n    return {goal:Math.min(4,ex.length),ex:uniqueByName(ex),opt:[],vid:uniqueByName(videos)};\n  }'),
              ('  const ver=q(".ver");if(ver)ver.textContent="Gainz v18.1.3 · 2026.08.28";', '  const ver=q(".ver");if(ver)ver.textContent="Gainz v18.1.4 · 2026.09.02";')
          ]

          for i, (old, new) in enumerate(replacements, 1):
              if old not in s:
                  raise SystemExit(f'patch target {i} not found')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Gainz v18.1.4: restore guided workout priorities and version badge'
          git push
