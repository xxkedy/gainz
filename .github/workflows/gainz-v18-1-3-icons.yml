name: Gainz v18.1.3 restore original panel icons

on:
  push:
    paths:
      - '.github/workflows/gainz-v18-1-3-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original muscle icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          reps = [
            ('chest:{icon:"🫁",label:"胸"', 'chest:{icon:"🏋️",label:"胸"'),
            ('abs:{icon:"🧱",label:"腹筋"', 'abs:{icon:"🔥",label:"腹筋"'),
            ('Gainz v18.1.2を準備中…', 'Gainz v18.1.3を準備中…'),
            ('src="./legacy.html?v=18.1.2"', 'src="./legacy.html?v=18.1.3"'),
            ('Gainz v18.1.2 · 2026.08.28', 'Gainz v18.1.3 · 2026.08.28')
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit(f'target not found: {old}')
            s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit icon correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Gainz v18.1.3: restore original chest and abs icons"
          git push
