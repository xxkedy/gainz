name: Gainz abs-first hotfix

on:
  push:
    paths:
      - '.github/workflows/gainz-abs-first.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put ab roller before leg raise
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'abs:{label:"腹筋",sub:"下腹・腹全体",names:["レッグレイズ","腹筋ローラー","サポート・ニーレイズ","ロシアンツイスト"],videos:['
          new = 'abs:{label:"腹筋",sub:"下腹・腹全体",names:["腹筋ローラー","レッグレイズ","サポート・ニーレイズ","ロシアンツイスト"],videos:['
          if old not in s:
              raise SystemExit('target abs order not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show ab roller first for abs workouts"
          git push
