<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Gainz</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0c}
#gainzFrame{display:block;width:100%;height:100dvh;border:0;background:#0a0a0c}
#boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0a0a0c;color:#a2a2ad;font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="boot">Gainz v18.4を準備中…</div>
<iframe id="gainzFrame" title="Gainz"></iframe>
<script>
(()=>{
  const frame=document.getElementById('gainzFrame');
  const boot=document.getElementById('boot');
  let loaded=false;
  let sourceReady=false;
  let patchCss='';
  let patchSource='';
  let applied=false;

  function fail(message,error){
    boot.textContent=message||'Gainzの読み込みに失敗。再読み込みして。';
    if(error)console.error(error);
  }

  function tryApply(){
    if(applied||!loaded||!sourceReady)return;
    try{
      const d=frame.contentDocument;
      if(!d||!d.head||!d.body)throw new Error('iframe document unavailable');
      const st=d.createElement('style');
      st.textContent=patchCss;
      d.head.appendChild(st);
      const sc=d.createElement('script');
      sc.textContent=patchSource;
      d.body.appendChild(sc);
      const ver=d.querySelector('.ver');
      if(ver)ver.textContent='Gainz v18.4 · 2026.08.28';
      applied=true;
      boot.remove();
    }catch(e){
      fail('Gainzの更新読み込みに失敗。再読み込みして。',e);
    }
  }

  frame.addEventListener('load',()=>{
    loaded=true;
    tryApply();
  },{once:true});

  fetch('./v18.3-source.html?v=18.4',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('patch source '+r.status);return r.text();})
    .then(text=>{
      const doc=new DOMParser().parseFromString(text,'text/html');
      patchCss=doc.getElementById('patchCss')?.textContent||'';
      patchSource=doc.getElementById('patchSource')?.textContent||'';
      if(!patchCss||!patchSource)throw new Error('patch source missing');
      sourceReady=true;
      tryApply();
    })
    .catch(e=>fail('Gainzの更新データ取得に失敗。再読み込みして。',e));

  frame.src='./legacy.html?v=18.4';

  setTimeout(()=>{
    if(!applied)fail('読み込みに時間がかかっています。右下の再読み込みを押して。');
  },12000);
})();
</script>
</body>
</html>
